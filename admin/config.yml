backend:
  name: github
  repo: Marcelocapotesilva/fenix-site
  branch: main
  base_url: https://fenix-site.forganizacoes.workers.dev

media_folder: "images/uploads"
public_folder: "/images/uploads"
locale: "en"

collections:
  - name: "journal"
    label: "Journal"
    files:
      - name: "posts"
        label: "All journal entries"
        file: "content/posts.json"
        format: "json"
        description: "Add, edit, reorder or delete your posts. Newest first."
        fields:
          - label: "Posts"
            name: "posts"
            widget: "list"
            label_singular: "Post"
            summary: "{{fields.title}}"
            fields:
              - { label: "Date", name: "date", widget: "string", hint: "Ex: 20 AUGUST 2026" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "sub", widget: "string", required: false }
              - { label: "Cover image", name: "img", widget: "image", required: false }
              - { label: "Body", name: "body", widget: "text", hint: "Deixe uma linha em branco entre parágrafos." }
